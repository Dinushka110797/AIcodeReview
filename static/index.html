<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Code Reviewer</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:        #080810;
      --bg2:       #0e0e1a;
      --surface:   #12121f;
      --surface2:  #1a1a2e;
      --surface3:  #22223a;
      --border:    rgba(255,255,255,0.07);
      --border2:   rgba(120,80,255,0.3);
      --accent:    #7855ff;
      --accent2:   #a78bfa;
      --accent3:   #38bdf8;
      --green:     #34d399;
      --red:       #f87171;
      --text:      #e8e6f0;
      --text2:     #9490b0;
      --text3:     #5a5570;
      --glow:      rgba(120,85,255,0.15);
      --glow2:     rgba(56,189,248,0.08);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ── BACKGROUND EFFECTS ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(120,85,255,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(56,189,248,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 50% 50%, rgba(120,85,255,0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Grid lines */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 0 24px 100px;
    }

    /* ── HEADER ── */
    header {
      padding: 56px 0 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .badge {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: var(--accent2);
      background: rgba(120,85,255,0.1);
      border: 1px solid rgba(120,85,255,0.25);
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 22px;
      animation: fadeDown 0.6s ease both;
    }

    header h1 {
      font-size: clamp(2.2rem, 6vw, 3.6rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
      text-align: center;
      animation: fadeDown 0.7s 0.1s ease both;
    }

    header h1 .word-ai {
      background: linear-gradient(135deg, #a78bfa 0%, #7855ff 40%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      margin-top: 14px;
      font-size: 1rem;
      color: var(--text2);
      font-weight: 400;
      text-align: center;
      animation: fadeDown 0.7s 0.2s ease both;
    }

    .header-pills {
      display: flex;
      gap: 10px;
      margin-top: 22px;
      flex-wrap: wrap;
      justify-content: center;
      animation: fadeDown 0.7s 0.3s ease both;
    }

    .pill {
      font-family: 'Space Mono', monospace;
      font-size: 0.68rem;
      color: var(--text3);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 20px;
      background: var(--surface);
    }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.6s 0.35s ease both;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(120,85,255,0.4), transparent);
    }

    /* ── LABEL ── */
    .field-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--text3);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .field-label .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    /* ── SELECT ── */
    .select-wrap {
      position: relative;
      margin-bottom: 20px;
    }

    select {
      width: 100%;
      padding: 12px 40px 12px 16px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: 'Space Mono', monospace;
      appearance: none;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(120,85,255,0.12);
    }

    .select-arrow {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text3);
      pointer-events: none;
      font-size: 0.7rem;
    }

    /* ── CODE TOOLBAR ── */
    .code-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-bottom: none;
      border-radius: 10px 10px 0 0;
    }

    .toolbar-dots {
      display: flex;
      gap: 5px;
      margin-right: 6px;
    }

    .toolbar-dots span {
      width: 10px; height: 10px;
      border-radius: 50%;
    }

    .toolbar-dots span:nth-child(1) { background: #ff5f56; }
    .toolbar-dots span:nth-child(2) { background: #ffbd2e; }
    .toolbar-dots span:nth-child(3) { background: #27c93f; }

    .tool-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text2);
      font-family: 'Space Mono', monospace;
      font-size: 0.68rem;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .tool-btn:hover { background: var(--surface3); color: var(--text); border-color: var(--accent2); }
    .tool-btn.danger:hover { border-color: var(--red); color: var(--red); }

    #char-count {
      margin-left: auto;
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: var(--text3);
    }

    /* ── TEXTAREA ── */
    textarea {
      width: 100%;
      height: 240px;
      padding: 16px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-top: none;
      border-radius: 0 0 10px 10px;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 0.82rem;
      line-height: 1.7;
      resize: vertical;
      margin-bottom: 20px;
      transition: border-color 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    textarea::placeholder { color: var(--text3); }

    /* ── REVIEW BUTTON ── */
    .review-btn-wrap {
      position: relative;
    }

    #reviewBtn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #6033ee, #7855ff 50%, #38bdf8);
      background-size: 200% 200%;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: opacity 0.2s, transform 0.15s;
      animation: gradShift 4s ease infinite;
    }

    @keyframes gradShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    #reviewBtn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(255,255,255,0.08), transparent);
    }

    #reviewBtn:hover { transform: translateY(-1px); opacity: 0.93; }
    #reviewBtn:active { transform: translateY(0); }
    #reviewBtn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    /* ── LOADING ── */
    #loading {
      display: none;
      margin-top: 28px;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
    }

    .loader-bar {
      width: 100%;
      height: 2px;
      background: var(--surface3);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .loader-bar::after {
      content: '';
      display: block;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent3), transparent);
      animation: barSlide 1.4s ease infinite;
    }

    @keyframes barSlide {
      0% { transform: translateX(-200%); }
      100% { transform: translateX(400%); }
    }

    .loader-text {
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      color: var(--text2);
      letter-spacing: 0.08em;
    }

    .loader-text span {
      color: var(--accent2);
      animation: blink 1.2s ease infinite;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ── ERROR ── */
    #error {
      display: none;
      margin-top: 20px;
      padding: 14px 18px;
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.25);
      border-radius: 10px;
      font-family: 'Space Mono', monospace;
      font-size: 0.78rem;
      color: var(--red);
    }

    /* ── RESULT CARD ── */
    #result {
      display: none;
      margin-top: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      animation: fadeUp 0.4s ease both;
    }

    .result-header {
      padding: 18px 24px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .result-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text2);
      text-transform: uppercase;
    }

    .result-title .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s ease infinite;
    }

    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }

    .result-actions { display: flex; gap: 8px; }

    .result-body {
      padding: 28px 28px;
      line-height: 1.75;
    }

    #result-content h2 {
      font-family: 'Syne', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent2);
      margin: 28px 0 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #result-content h2:first-child { margin-top: 0; }

    #result-content p,
    #result-content li {
      font-size: 0.9rem;
      color: var(--text2);
      margin-bottom: 6px;
    }

    #result-content strong { color: var(--text); }

    #result-content ul {
      padding-left: 18px;
      margin-bottom: 6px;
    }

    #result-content li::marker { color: var(--accent); }

    #result-content pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin: 10px 0;
    }

    #result-content code {
      font-family: 'Space Mono', monospace;
      font-size: 0.78rem;
      color: var(--accent3);
    }

    #review-time {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: var(--text3);
    }

    /* ── HISTORY ── */
    #history-section {
      display: none;
      margin-top: 20px;
      animation: fadeUp 0.4s ease both;
    }

    .history-header {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 10px;
      padding-left: 4px;
    }

    .history-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      margin-bottom: 8px;
    }

    .history-item:hover { border-color: var(--border2); background: var(--surface2); }

    .hi-preview {
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      color: var(--text2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 500px;
    }

    .hi-meta {
      font-size: 0.65rem;
      color: var(--text3);
      margin-top: 4px;
      font-family: 'Space Mono', monospace;
    }

    .hi-lang {
      font-family: 'Space Mono', monospace;
      font-size: 0.62rem;
      background: rgba(120,85,255,0.15);
      color: var(--accent2);
      border: 1px solid rgba(120,85,255,0.2);
      padding: 3px 10px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 1;
      border-top: 1px solid var(--border);
      padding: 28px 24px;
      text-align: center;
    }

    .footer-inner {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .footer-name {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      background: linear-gradient(135deg, var(--accent2), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .footer-sub {
      font-family: 'Space Mono', monospace;
      font-size: 0.62rem;
      color: var(--text3);
      letter-spacing: 0.1em;
    }

    .footer-divider {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border2), transparent);
      margin: 4px 0;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    /* ── THEME TOGGLE ── */
    .theme-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text2);
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      padding: 7px 13px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.06em;
    }

    .theme-btn:hover { border-color: var(--accent2); color: var(--accent2); }

    /* ── LIGHT MODE ── */
    body.light {
      --bg:        #f5f4ff;
      --bg2:       #eeecff;
      --surface:   #ffffff;
      --surface2:  #f0eeff;
      --surface3:  #e4e0ff;
      --border:    rgba(0,0,0,0.08);
      --border2:   rgba(120,80,255,0.25);
      --text:      #1a1630;
      --text2:     #4a4470;
      --text3:     #9490b0;
      --glow:      rgba(120,85,255,0.08);
    }

    body.light::before {
      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(120,85,255,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(56,189,248,0.04) 0%, transparent 60%);
    }

    body.light::after {
      background-image:
        linear-gradient(rgba(0,0,0,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
    }
  </style>
</head>
<body>

  <button class="theme-btn" onclick="toggleTheme()">◐ THEME</button>

  <div class="wrap">

    <!-- HEADER -->
    <header>
      <div class="badge">⚡ POWERED BY GROQ · LLAMA 3.3 · 70B</div>
      <h1><span class="word-ai">AI</span> Code Reviewer</h1>
      <p>Paste your code. Get expert-level feedback in seconds.</p>
      <div class="header-pills">
        <span class="pill">Python</span>
        <span class="pill">JavaScript</span>
        <span class="pill">Java</span>
        <span class="pill">C++</span>
        <span class="pill">SQL</span>
        <span class="pill">+ more</span>
      </div>
    </header>

    <!-- MAIN CARD -->
    <div class="card">

      <!-- Language -->
      <div class="field-label"><span class="dot"></span> Language</div>
      <div class="select-wrap">
        <select id="language">
          <option value="Python">Python</option>
          <option value="JavaScript">JavaScript</option>
          <option value="HTML">HTML</option>
          <option value="CSS">CSS</option>
          <option value="Java">Java</option>
          <option value="C++">C++</option>
          <option value="SQL">SQL</option>
          <option value="TypeScript">TypeScript</option>
        </select>
        <span class="select-arrow">▼</span>
      </div>

      <!-- Code input -->
      <div class="field-label"><span class="dot"></span> Your Code</div>
      <div class="code-toolbar">
        <div class="toolbar-dots">
          <span></span><span></span><span></span>
        </div>
        <button class="tool-btn" onclick="loadSample()">⊕ Sample</button>
        <button class="tool-btn" onclick="copyCode()">⎘ Copy</button>
        <button class="tool-btn danger" onclick="clearCode()">✕ Clear</button>
        <span id="char-count">0 chars</span>
      </div>
      <textarea id="code" placeholder="// Paste your code here and let the AI do the rest..."></textarea>

      <!-- Button -->
      <button id="reviewBtn" onclick="reviewCode()">
        ⟡ &nbsp; Analyse &amp; Review Code
      </button>
    </div>

    <!-- Loading -->
    <div id="loading">
      <div class="loader-bar"></div>
      <div class="loader-text">Analysing your code<span>_</span></div>
    </div>

    <!-- Error -->
    <div id="error"></div>

    <!-- Result -->
    <div id="result">
      <div class="result-header">
        <div class="result-title">
          <span class="live-dot"></span>
          Review Complete
          <span id="review-time"></span>
        </div>
        <div class="result-actions">
          <button class="tool-btn" onclick="exportPDF()">⬇ Export</button>
          <button class="tool-btn" onclick="copyResult()">⎘ Copy</button>
        </div>
      </div>
      <div class="result-body">
        <div id="result-content"></div>
      </div>
    </div>

    <!-- History -->
    <div id="history-section">
      <div class="history-header">// Recent Reviews</div>
      <div id="history-list"></div>
    </div>

  </div>

  <!-- FOOTER -->
  <footer>
    <div class="footer-inner">
      <div class="footer-divider"></div>
      <div class="footer-name">S.D.L.W. Silva</div>
      <div class="footer-sub">AI CODE REVIEWER · BUILT WITH PYTHON + GROQ API</div>
      <div class="footer-divider"></div>
    </div>
  </footer>

  <script>
    let history = [];
    try { history = JSON.parse(localStorage.getItem('reviewHistory') || '[]'); } catch(e) {}

    // Theme
    function toggleTheme() {
      document.body.classList.toggle('light');
      try { localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark'); } catch(e) {}
    }
    try { if (localStorage.getItem('theme') === 'light') document.body.classList.add('light'); } catch(e) {}

    // Char counter
    document.getElementById('code').addEventListener('input', updateCount);
    function updateCount() {
      const len = document.getElementById('code').value.length;
      document.getElementById('char-count').textContent = len.toLocaleString() + ' chars';
    }

    function clearCode() {
      document.getElementById('code').value = '';
      document.getElementById('char-count').textContent = '0 chars';
    }

    function copyCode() {
      const code = document.getElementById('code').value;
      if (!code) { alert('Nothing to copy!'); return; }
      navigator.clipboard.writeText(code).then(() => {
        const btn = event.target;
        const orig = btn.textContent;
        btn.textContent = '✓ Copied';
        setTimeout(() => btn.textContent = orig, 1500);
      });
    }

    function copyResult() {
      const text = document.getElementById('result-content').innerText;
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        const btn = event.target;
        const orig = btn.textContent;
        btn.textContent = '✓ Copied';
        setTimeout(() => btn.textContent = orig, 1500);
      });
    }

    function exportPDF() {
      const content = document.getElementById('result-content').innerHTML;
      if (!content) return;
      const win = window.open('', '_blank');
      win.document.write(`<!DOCTYPE html><html><head><title>Code Review — S.D.L.W.Silva</title>

          h1 { color: #7855ff; border-bottom: 2px solid #ede9fe; padding-bottom: 12px; }
          h2 { color: #7855ff; margin-top: 28px; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.1em; }
          pre { background: #f5f4ff; border-left: 3px solid #7855ff; padding: 16px; border-radius: 4px; overflow-x: auto; }
          code { font-family: monospace; font-size: 0.85rem; color: #1d4ed8; }
          li { margin-bottom: 4px; }
          footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid #ede9fe; font-size: 0.8rem; color: #9490b0; text-align: center; }
        </style></head><body>
        <h1>🤖 AI Code Review</h1>
        ${content}
        <footer>Generated by AI Code Reviewer · S.D.L.W.Silva</footer>

      win.document.close();
      setTimeout(() => win.print(), 500);
    }

    function loadSample() {
      const lang = document.getElementById('language').value;
      const samples = {
        Python: `def calculate_average(numbers):\n    total = 0\n    for n in numbers:\n        total = total + n\n    average = total / len(numbers)\n    return average\n\nresult = calculate_average([10, 20, 30])\nprint("Average:", result)`,
        JavaScript: `function fetchUser(id) {\n    fetch('https://api.example.com/user/' + id)\n    .then(res => res.json())\n    .then(data => {\n        console.log(data)\n    })\n}`,
        HTML: `<div>\n  <h1>Hello World</h1>\n  <p>This is my website</p>\n  <button onclick="alert('clicked')">Click Me</button>\n</div>`,
        CSS: `body {\n  background: white;\n  color: black;\n  font-size: 16px;\n}\nh1 {\n  color: blue;\n}`,
        Java: `public class Main {\n    public static void main(String[] args) {\n        int[] numbers = {10, 20, 30};\n        int total = 0;\n        for (int n : numbers) {\n            total = total + n;\n        }\n        System.out.println("Total: " + total);\n    }\n}`,
        "C++": `#include <iostream>\nusing namespace std;\nint main() {\n    int numbers[] = {10, 20, 30};\n    int total = 0;\n    for (int i = 0; i < 3; i++) {\n        total = total + numbers[i];\n    }\n    cout << "Total: " << total << endl;\n    return 0;\n}`,
        SQL: `SELECT users.name, COUNT(orders.id) as total_orders\nFROM users\nLEFT JOIN orders ON users.id = orders.user_id\nWHERE users.active = 1\nGROUP BY users.name\nORDER BY total_orders DESC;`,
        TypeScript: `function greetUser(name: string, age: number): string {\n    if (age < 18) {\n        return "Hello " + name + ", you are a minor.";\n    }\n    return "Hello " + name + ", welcome!";\n}\nconsole.log(greetUser("Alice", 25));`
      };
      document.getElementById('code').value = samples[lang] || '// Paste your code here';
      updateCount();
    }

    function renderHistory() {
      const section = document.getElementById('history-section');
      const list = document.getElementById('history-list');
      if (!history.length) { section.style.display = 'none'; return; }
      section.style.display = 'block';
      list.innerHTML = history.map((h, i) => `
        <div class="history-item" onclick="loadHistory(${i})">
          <div>
            <div class="hi-preview">${h.preview}</div>
            <div class="hi-meta">${h.time} · ${h.duration}s</div>
          </div>
          <span class="hi-lang">${h.language}</span>
        </div>
      `).join('');
    }

    function loadHistory(i) {
      const h = history[i];
      document.getElementById('code').value = h.code;
      document.getElementById('language').value = h.language;
      document.getElementById('result-content').innerHTML = h.resultHtml;
      document.getElementById('result').style.display = 'block';
      document.getElementById('review-time').textContent = '· from history';
      updateCount();
      document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
    }

    async function reviewCode() {
      const code = document.getElementById('code').value.trim();
      const language = document.getElementById('language').value;
      const btn = document.getElementById('reviewBtn');
      const loading = document.getElementById('loading');
      const result = document.getElementById('result');
      const error = document.getElementById('error');
      const content = document.getElementById('result-content');

      if (!code) { alert('Please paste some code first!'); return; }

      btn.disabled = true;
      loading.style.display = 'block';
      result.style.display = 'none';
      error.style.display = 'none';

      const startTime = Date.now();

      try {
        const response = await fetch('/review', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, language })
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.detail || 'Server error');
        }

        const data = await response.json();
        const duration = ((Date.now() - startTime) / 1000).toFixed(1);

        let html = data.review
          .replace(/## (.*)/g, '<h2>$1</h2>')
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/```[\w]*\n?([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
          .replace(/^- (.+)/gm, '<li>$1</li>')
          .replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>')
          .replace(/\n\n/g, '<br>');

        content.innerHTML = html;
        result.style.display = 'block';
        document.getElementById('review-time').textContent = `· ${duration}s`;

        const entry = {
          code, language,
          resultHtml: html,
          preview: code.substring(0, 55).replace(/\n/g, ' ') + '...',
          time: new Date().toLocaleTimeString(),
          duration
        };
        history.unshift(entry);
        if (history.length > 5) history.pop();
        try { localStorage.setItem('reviewHistory', JSON.stringify(history)); } catch(e) {}
        renderHistory();
        result.scrollIntoView({ behavior: 'smooth' });

      } catch (err) {
        error.textContent = '✕  ' + (err.message || 'Something went wrong. Make sure the backend is running.');
        error.style.display = 'block';
      } finally {
        btn.disabled = false;
        loading.style.display = 'none';
      }
    }

    renderHistory();
  </script>
